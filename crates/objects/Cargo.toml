[package]
name = "metaverse_objects"
version = "0.3.2"
authors = ["Skyler Clark<skylerjaneclark@gmail.com>"]
description = "Metaverse objects, a crate for handling objects in Benthic"
license = "AGPL-3.0-or-later"
homepage= "https://benthic-mmo.github.io/"
repository = "https://github.com/benthic-mmo/metaverse_client/tree/main/crates/objects"
edition = "2024"

[dependencies]
benthic_protocol = "0.3.2" 
metaverse_messages = "0.3.2" 
metaverse_avatar = "0.3.2" 
metaverse_cache = "0.3.2" 
benthic_default_asset_converter= "0.3.2" 
metaverse_mesh = "0.3.2" 

thiserror = "2.0.20"
image = "0.25.10"
jpeg2k = "0.10.1"
uuid = "1.26.1"
bytes = "1.12.1"
awc = "3.8.2"
sqlx = {version="0.9.0", features=["sqlite"]}
glam = "0.32.1"
log = "0.4.34"
serde_json = "1.0.151"
indexmap = "2.14.2"
