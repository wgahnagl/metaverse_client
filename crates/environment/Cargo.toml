[package]
name = "metaverse_environment"
version = "0.2.1"
authors = ["Skyler Clark<skylerjaneclark@gmail.com>"]
description = "metaverse environment data handler"
license = "AGPL-3.0-or-later"
homepage= "https://benthic-mmo.github.io/"
repository = "https://github.com/benthic-mmo/metaverse_client/tree/main/crates/environment"
edition = "2024"

[dependencies]
bitreader = "0.3.11"
bytemuck = {version = "1.25.2", features = ["derive"] }
byteorder = "1.5.0"
glam = {version="0.32.1", features=["serde"]}
gltf = "1.4.1"
gltf-json = "1.4.1"
log = "0.4.34"
metaverse_messages = "0.2.1" 
benthic_protocol = "0.2.1" 
once_cell = "1.21.4"
twox-hash = "2.1.4"
metaverse_mesh = "0.2.1" 
uuid = "1.26.1"
image = "0.25.10"
thiserror = "2.0.20"
awc = "3.8.2"
